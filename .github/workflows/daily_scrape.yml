name: Daily Job Scraper & Tracker

on:
  schedule:
    # 4 Smart Daily Scans (IST is UTC + 5:30):
    # - 09:00 AM IST -> 03:30 UTC (Morning batch)
    # - 01:00 PM IST -> 07:30 UTC (Lunchtime batch)
    # - 05:00 PM IST -> 11:30 UTC (Evening batch)
    # - 09:00 PM IST -> 15:30 UTC (End-of-day recap)
    - cron: '30 3,7,11,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-scraper/requirements.txt

      - name: Run Job Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONUNBUFFERED: "1"
        run: |
          python backend-scraper/scraper.py
