    <title>ZipZap - Instant Daily Job Portal & Application Tracker</title>
    <meta name="description" content="ZipZap - Instant Daily Job Aggregator & Application Tracker. Aggregates verified active jobs across LinkedIn, Indeed, Naukri, Glassdoor, and RemoteOK." />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
